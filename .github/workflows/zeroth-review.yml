name: AegisFlow zeroth-review checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/zeroth-review-upscale]

jobs:
  donor-matching-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install pytest "sqlalchemy==2.0.36" "pydantic>=2.8,<3" "fastapi==0.115.0" "pydantic-settings" "geoalchemy2" "python-dotenv"
      - name: Test geospatial ranking, safety, and integration contracts
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_geospatial_matching.py backend/tests/test_transfer_state_machine.py backend/tests/test_forecast_engine.py backend/tests/test_medicine_safety.py backend/tests/test_integration_contract.py
      - name: Compile backend Python sources
        run: python -m compileall -q backend/app backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
